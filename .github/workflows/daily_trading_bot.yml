name: TMF Daily Quant Bot

on:
  schedule:
    # 每天早上 08:30 執行 (台灣時間 08:30 = UTC 00:30)
    - cron: '30 0 * * 1-5'
  workflow_dispatch:
  repository_dispatch:
    types: [trigger_bot]

jobs:
  run-bot:
    runs-on: ubuntu-24.04
    steps:
      - name: 1. 簽出專案程式碼
        uses: actions/checkout@v3

      - name: 2. 設定 Python 環境
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 3. 安裝必要套件
        run: |
          pip install pandas numpy yfinance requests

      - name: 4. 執行每日任務 (下載昨日資料 + 最佳化 + 寄信)
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_PASSWORD: ${{ secrets.GMAIL_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
        run: |
          python scripts/daily_bot_pipeline.py

      - name: 5. 將最新累積的資料存回 GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/TMF_tick.csv
          git commit -m "自動更新 TMF 歷史資料庫" || echo "資料無變動"
          git push
