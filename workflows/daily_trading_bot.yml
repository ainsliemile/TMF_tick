name: TMF Daily Quant Bot

on:
  schedule:
    # 每天傍晚 18:00 自動下載資料 (UTC 10:00 = 台灣 18:00)
    - cron: '0 10 * * 1-5'
    # 每天早上 00:30 (UTC) = 台灣早上 08:30 自動跑參數並寄信
    - cron: '30 0 * * 1-5'
  workflow_dispatch: # 支援手動點擊觸發

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 簽出專案程式碼
        uses: actions/checkout@v3

      - name: 2. 設定 Python 環境
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 3. 安裝必要套件
        run: |
          pip install pandas numpy yfinance requests

      - name: 4. 執行每日任務
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_PASSWORD: ${{ secrets.GMAIL_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
        run: |
          python scripts/daily_bot_pipeline.py
